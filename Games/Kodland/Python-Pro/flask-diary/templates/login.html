<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O diário do programador</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <header class="header">
        <img src="../static/img/logo.svg" alt="logo" width="30" height="30">
        <ul class="main-list">

        </ul>
      </header>
      <main class="main-login">
        {% block content %}
        <form action="{{ url_for('login') }}" method="POST" class="login">
            <p class="error">{{error}}</p>

            <!-- Atividade #2. Criar campos de login -->
            <label for="email">
                <input class="form__input" type="email" name="email" id="email" placeholder="Digite seu email" required>
            </label> 
            <label for="password">
                <input class="form__input" type="password" name="password" id="password" placeholder="Digite sua senha" required>
            </label>

            <!--  -->
                <button class="form__button">Entrar</button>
                <a href="/reg" class="form__button reg__link">Registrar</a>
        </form>
        {% endblock %}
      </main>
</body>
</html>
